{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <!-- Tilt Card -->
        <div class="card-custom tilt-card p-5 fade-in-up" style="position: relative; overflow: hidden; transform-style: preserve-3d;">
            
            <!-- Glow background effect -->
            <div class="profile-glow"></div>
            
            <div style="transform: translateZ(30px); position: relative; z-index: 2;">
                <div class="text-center mb-4">
                    <div class="profile-avatar mb-3 mx-auto shadow">
                        <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="currentColor" class="bi bi-person-fill text-softblue" viewBox="0 0 16 16">
                            <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
                        </svg>
                    </div>
                    <h2 class="text-white fw-bold mb-1" style="transform: translateZ(15px);">{{ user.name }}</h2>
                    <p class="text-muted-custom" style="transform: translateZ(10px);">{{ user.email }}</p>
                </div>
                
                <hr class="border-custom my-4">
                
                <div class="row text-center mb-4" style="transform: translateZ(20px);">
                    <div class="col-6">
                        <h4 class="text-white fw-bold mb-0">{{ total_tasks }}</h4>
                        <span class="text-muted-custom small text-uppercase tracking-wide">Total Tasks</span>
                    </div>
                    <div class="col-6">
                        <h4 class="text-sage fw-bold mb-0">{{ critical_tasks }}</h4>
                        <span class="text-muted-custom small text-uppercase tracking-wide">Critical</span>
                    </div>
                </div>
                
                <div class="d-grid mt-2" style="transform: translateZ(25px);">
                    <a href="{{ url_for('logout') }}" class="btn btn-outline-danger py-2 fw-medium">Sign Out</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
